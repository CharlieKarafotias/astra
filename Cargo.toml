[package]
name = "astra"
version = "1.3.1"
license = "MIT"
edition = "2024"
repository = "https://github.com/CharlieKarafotias/astra"
authors = ["Charlie Karafotias <cnkara2023@gmail.com>"]
description = "A tool for generating wallpaper images"

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.7"
directories = "6.0.0"
image = { version = "0.25.10", features = ["png", "rayon"] }
num-complex = { version = "0.4.6", features = ["std"] }
rand = "0.10.2"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
	"Win32",
	"Win32_System",
	"Win32_System_Registry",
	"Win32_UI",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[dev-dependencies]
tempfile = "3.27.0"
